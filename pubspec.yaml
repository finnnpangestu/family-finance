name: ff
description: "FF - Family Finance. Offline-first family finance tracker."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  equatable: ^3.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  googleapis: ^18.0.0
  http: ^1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  shadcn_flutter: ^0.0.47
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Bundled so typography works fully offline (runtime fetching is disabled).
  assets:
    - assets/google_fonts/
    - assets/icons/
    - assets/images/
    - assets/branding/
    - .env

# Generated from assets/images/Family Finance Logo App.png (see assets/branding/).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  # Safe-zone padding is already baked into the foreground image.
  adaptive_icon_foreground_inset: 0

# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_logo.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_android12.png
