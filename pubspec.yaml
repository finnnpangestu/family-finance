name: ff
description: "FF - Family Finance. Offline-first family finance tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  equatable: ^3.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  googleapis: ^18.0.0
  http: ^1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  sqflite: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  # Bundled so typography works fully offline (runtime fetching is disabled).
  assets:
    - assets/google_fonts/
    - assets/icons/
    - assets/images/
