name: ff
description: "FF - Family Finance. Offline-first family finance tracker."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  equatable: ^3.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  googleapis: ^18.0.0
  http: ^1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  shadcn_flutter: ^0.0.47
  share_plus: ^13.3.1
  sqflite: ^2.4.2+1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# image 4.11.0 calls ZLibDecoder.decodeLazy (archive >= 4.1) but only declares
# archive ^4.0.9, while pdf 3.12 caps archive < 4.1. 4.10.1 works with both.
# Remove once pdf >= 3.13 is usable (needs Dart >= 3.12).
dependency_overrides:
  image: 4.10.1

flutter:
  uses-material-design: true

  # Bundled so typography works fully offline (runtime fetching is disabled).
  assets:
    - assets/google_fonts/
    - assets/icons/
    - assets/images/
    - assets/branding/
    - .env

# Generated from assets/images/Family Finance Logo App.png (see assets/branding/).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/Family Finance Logo App 120x120.png
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/Family Finance Logo App 120x120.png
  adaptive_icon_foreground_inset: 15

# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_logo.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_android12.png
